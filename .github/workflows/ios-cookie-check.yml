name: iOS cookie check

# The one thing Android cannot tell you. ADR-0004 has this client set every
# `Cookie` header by hand with `credentials: "omit"`, because on iOS
# `NSHTTPCookieStorage` can silently overwrite a manually-set header — a failure
# that works on Android and in Expo Go, then 401s on an iOS device and reads as a
# server bug. The unit tests pin `credentials: "omit"` against a fake `fetch`,
# which guards the line but cannot observe the platform.
#
# Manual only. macOS bills at 10x, and a run is roughly 100-150 minutes of quota
# — the same reason build.yml is dispatch-only. Run it when the credential layer
# changes, not on every push.
on:
  workflow_dispatch:

concurrency:
  group: ios-cookie-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cookie-check:
    name: Cookie header survives iOS networking
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      # The simulator shares the host's network, so loopback is the runner
      # itself. `localhost` rather than 127.0.0.1 because it is the name ATS
      # exempts by default.
      EXPO_PUBLIC_API_URL: http://localhost:8099
      FAKE_API_PORT: "8099"

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # flow.yaml addresses the app by bundle id. Deriving it here would mean
      # templating the flow; asserting it instead fails in one obvious line if
      # app.json ever changes.
      - name: Check the bundle id the flow targets
        run: |
          set -euo pipefail
          EXPECTED=com.zeestglobal.joychat
          ACTUAL=$(node -p "require('./app.json').expo.ios.bundleIdentifier")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::app.json says $ACTUAL but scripts/ios-cookie-check/flow.yaml targets $EXPECTED. Update the flow."
            exit 1
          fi

      # ios/ is gitignored and generated, so it never exists in a fresh checkout.
      - name: Prebuild iOS project
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      # A Release build talks plain HTTP to a loopback fake server, which ATS
      # refuses by default. Patched here rather than in app.json so the shipping
      # app keeps ATS fully on — ios/ is generated and thrown away with the runner.
      - name: Allow cleartext to the local fake API
        run: |
          set -euo pipefail
          PLIST=$(ls ios/*/Info.plist | head -1)
          echo "Patching $PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      # Release, so the JS bundle is embedded and no Metro has to stay alive.
      # EXPO_PUBLIC_API_URL is read at bundle time, which is why it is job-level env.
      - name: Build for the simulator
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Boot a simulator and install the app
        run: |
          set -euo pipefail
          # Whichever iPhone this Xcode ships; hardcoding a model breaks on bumps.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iPhone simulator available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          APP="ios/build/Build/Products/Release-iphonesimulator/${SCHEME}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Build succeeded but $APP is missing."
            exit 1
          fi
          xcrun simctl install "$UDID" "$APP"

      - name: Start the fake API
        run: |
          set -euo pipefail
          node scripts/ios-cookie-check/fake-api.mjs > fake-api.log 2>&1 &
          echo $! > fake-api.pid
          until curl -sf "http://localhost:${FAKE_API_PORT}/__report" > /dev/null; do sleep 1; done
          echo "fake API is up"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Drive the simulator
        run: maestro test scripts/ios-cookie-check/flow.yaml --format junit --output maestro-report.xml

      - name: Judge what reached the server
        run: REPORT_URL="http://localhost:${FAKE_API_PORT}/__report" node scripts/ios-cookie-check/assert-report.mjs

      - name: Record the outcome
        if: always()
        run: |
          {
            echo "### iOS cookie check"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "Every request carried the \`Cookie\` header this client wrote, and nothing the native store planted. \`credentials: \"omit\"\` is holding on iOS."
            else
              echo "Failed. See **Judge what reached the server** for which request carried a planted decoy, and \`fake-api.log\` for every request the simulator made."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp fake-api.log diagnostics/ 2>/dev/null || true
          cp maestro-report.xml diagnostics/ 2>/dev/null || true
          cp -R ~/.maestro/tests diagnostics/maestro-tests 2>/dev/null || true
          xcrun simctl io "${UDID:-booted}" screenshot diagnostics/final-screen.png 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-cookie-check-${{ github.sha }}
          path: diagnostics
          retention-days: 14

      - name: Stop the fake API
        if: always()
        run: kill "$(cat fake-api.pid)" 2>/dev/null || true
