# Builds the Android APK on EAS, downloads it, and publishes it as a GitHub
# Release asset (tag `joychat-v<X.Y.Z>`, asset `joychat-release.apk`).
#
# A Release rather than an Actions artifact: artifacts expire and count against
# the repository's storage allowance, and a Release does neither. It is also the
# shape an in-app force-update check would read, if one is ever added — nothing
# consumes the tag today, so the prefix is only a convention, but changing it
# later means retagging every release that already exists.
#
# Triggers on every push to main, so the version in app.json is what decides
# whether a run publishes something new. A push that does not bump
# `expo.version` re-uploads to the tag that is already there, replacing the APK
# on it rather than failing.
#
# Requires one repository secret: EXPO_TOKEN, from
# https://expo.dev/settings/access-tokens
#
# The bundle-time configuration comes from the `preview` profile's `env` block
# in eas.json, which the EAS builder reads. Nothing has to be set on expo.dev,
# and nothing here can supply it: `EXPO_PUBLIC_*` is inlined by Metro on Expo's
# servers, which this runner's environment never reaches.

name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Override the version (default = expo.version in app.json)
        required: false
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

# For creating and updating the Release.
permissions:
  contents: write

jobs:
  publish:
    name: Build, download, release
    runs-on: ubuntu-latest
    # --wait bills runner minutes for the whole EAS queue as well as the build,
    # and the free queue is unbounded. This caps what one run can cost; a build
    # still in the queue when it fires is not cancelled on EAS, so the APK can
    # be collected from the build page by hand.
    timeout-minutes: 120

    env:
      # Only a convention today. If an update check is ever added, this is the
      # prefix it has to look for.
      RELEASE_TAG_PREFIX: joychat-v

    steps:
      - uses: actions/checkout@v4

      # A missing secret otherwise surfaces as an opaque auth failure from the
      # EAS CLI several steps later.
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not set. Run: gh secret set EXPO_TOKEN"
            exit 1
          fi

      # app.json is the one place a version is written, so the tag, the title
      # and the asset name are all derived from it rather than repeated here.
      - name: Resolve version and names
        id: meta
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./app.json').expo.version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z, got \"$VERSION\". Set expo.version in app.json."
            exit 1
          fi

          APP_NAME="$(node -p "require('./app.json').expo.name")"
          if [ -z "$APP_NAME" ]; then
            echo "::error::app.json must set expo.name."
            exit 1
          fi

          # From expo.name, deliberately not expo.slug. The slug is the EAS
          # project's identifier and is fixed for the life of that project's id,
          # so it can name something the product no longer is; the asset people
          # download should carry the product's name instead.
          APK_BASE="$(printf '%s' "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')"
          if [ -z "$APK_BASE" ]; then
            echo "::error::expo.name \"$APP_NAME\" has no alphanumeric characters to build a filename from."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=${RELEASE_TAG_PREFIX}${VERSION}"
            echo "apk=${APK_BASE}-release.apk"
            echo "title=${APP_NAME} Android ${VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "Version $VERSION → tag ${RELEASE_TAG_PREFIX}${VERSION}, asset ${APK_BASE}-release.apk"

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Not optional, even though Expo's servers do the building: eas-cli
      # evaluates app.config.js locally to resolve the config it uploads, and
      # that file names expo-router among the plugins. Without node_modules it
      # fails with "Failed to resolve plugin for module expo-router".
      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --wait, unlike the manual iOS workflow: this run has to hold the build
      # id to download an APK with, so there is nothing to do but wait for it.
      - name: Build on EAS
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # stdout is the JSON payload; progress goes to stderr and stays in the log.
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json

          node <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync("eas-build.json", "utf8").trim();

          // The CLI has been known to print a line before the payload, so fall
          // back to the last JSON value in the file rather than the whole of it.
          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch {
            const start = Math.max(raw.lastIndexOf("["), raw.lastIndexOf("{"));
            if (start < 0) {
              console.error("No JSON in eas-build.json:", raw.slice(0, 800));
              process.exit(1);
            }
            parsed = JSON.parse(raw.slice(start));
          }

          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          if (!build?.id) {
            console.error("EAS build JSON has no id:", raw.slice(0, 800));
            process.exit(1);
          }

          const url = build.artifacts?.buildUrl || build.artifacts?.applicationArchiveUrl || "";
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `id=${build.id}\n`);
          // Heredoc form, so a URL with special characters cannot break parsing.
          fs.appendFileSync(out, `url<<EOF\n${url}\nEOF\n`);

          console.log("Build", build.id, "status", build.status ?? "(none)");
          console.log("Artifact URL present:", Boolean(url));
          NODE

      - name: Download the APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.id }}
          BUILD_URL: ${{ steps.build.outputs.url }}
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          set -euo pipefail
          mkdir -p dist
          DEST="dist/${APK}"

          # The artifact URL is the direct route. `eas build:download` is the
          # fallback for a finished build whose JSON carried no URL, and it
          # names the file itself, so it lands somewhere disposable first.
          if [ -n "$BUILD_URL" ]; then
            echo "Downloading from the artifact URL"
            curl -fsSL --retry 3 --retry-delay 2 "$BUILD_URL" -o "$DEST"
          else
            echo "No artifact URL in the build JSON; falling back to eas build:download"
            TMP="$(mktemp -d)"
            ( cd "$TMP" && eas build:download --build-id "$BUILD_ID" --non-interactive )
            FOUND="$(find "$TMP" -type f -name '*.apk' | head -n 1)"
            if [ -z "$FOUND" ]; then
              echo "::error::eas build:download produced no APK."
              ls -laR "$TMP" || true
              exit 1
            fi
            mv "$FOUND" "$DEST"
            rm -rf "$TMP"
          fi

          test -s "$DEST"
          ls -lh "$DEST"
          file "$DEST" || true

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          VERSION: ${{ steps.meta.outputs.version }}
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          set -euo pipefail
          NOTES="JoyChat Android ${VERSION}. Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}."

          # --clobber, so a second push on an unchanged version replaces the
          # asset rather than failing on a name that is already taken.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${APK}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "dist/${APK}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          {
            echo "### $TITLE"
            echo
            echo "[Download ${APK}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
