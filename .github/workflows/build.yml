name: iOS Build

# Manual only, and deliberately so: this builds on a macOS runner, which bills
# at 10x on a private repo — roughly 300 minutes of quota per run.
#
# Android is not here. It is android-release.yml, which runs on every push to
# main, builds on EAS and publishes the APK to a GitHub Release. One Android
# path rather than two, because two copies of the build configuration is how
# they end up disagreeing.
on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    # Metro inlines `EXPO_PUBLIC_*` at bundle time, and this job bundles on the
    # runner rather than on EAS — xcodebuild's React Native phase is what reads
    # these. So neither source the Android job relies on reaches here: `.env` is
    # gitignored and absent from the checkout, and `eas.json`'s `env` block is
    # read by `eas build` alone, never by `expo prebuild`. Unset, they compile to
    # `undefined`, `lib/api-config.ts` throws at import, and the IPA crashes on
    # launch rather than failing here. Job-level for the same reason
    # ios-cookie-check.yml sets its own: the value has to be in the environment
    # xcodebuild inherits.
    #
    # Repository *variables*, not secrets: an `EXPO_PUBLIC_*` value is inlined
    # into the shipped bundle by definition, so anyone holding the IPA can read
    # it, and hiding it in the log would only make it harder to check.
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      # The same fail-fast the Android job gives EXPO_TOKEN, and for a worse
      # failure: a missing token stops the build, a missing API URL ships an
      # IPA that looks fine and dies on launch.
      - name: Require the bundle-time configuration
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::EXPO_PUBLIC_API_URL repository variable is not set. Run: gh variable set EXPO_PUBLIC_API_URL"
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID is not set. The build succeeds and Google sign-in is disabled in it."
          fi

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ios/ is gitignored and generated (CNG), so it never exists in a fresh
      # checkout. --no-install splits prebuild from pod install so a failure in
      # either is individually diagnosable.
      - name: Prebuild iOS project
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      # No Apple Developer account, so the build is unsigned. Derive the scheme
      # from the generated workspace rather than hardcoding "JoyChat", so renaming
      # expo.name cannot silently break CI.
      - name: Build unsigned .app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      # An .ipa is a zip with the .app under Payload/.
      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="ios/build/Build/Products/Release-iphoneos/${SCHEME}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::xcodebuild succeeded but $APP is missing."
            exit 1
          fi
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry joychat-unsigned.ipa Payload && rm -rf Payload)
          ls -lh dist/joychat-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: joychat-ios-unsigned-${{ github.sha }}
          path: dist/joychat-unsigned.ipa
          retention-days: 30

      - name: Note how to install
        if: success()
        run: |
          {
            echo "### iOS unsigned IPA"
            echo
            echo "Download the \`joychat-ios-unsigned-${{ github.sha }}\` artifact from this run."
            echo
            echo "It is **unsigned** — it will not install via TestFlight or the App Store. Sideload it with AltStore or Sideloadly. On a free Apple ID the signature expires after 7 days."
          } >> "$GITHUB_STEP_SUMMARY"
